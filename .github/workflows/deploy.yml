name: Deploy Cloudflare
on:
  workflow_run:
    workflows: [Checks]
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Check deployment credential
        id: auth
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Add CLOUDFLARE_API_TOKEN to the production environment secrets to enable automatic deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
        if: steps.auth.outputs.ready == 'true'
      - run: npm run build
        if: steps.auth.outputs.ready == 'true'
      - name: Apply additive migrations and deploy
        if: steps.auth.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cca222dd2d4b9fa1075fb4a87b7c94e6
        run: |
          npx wrangler d1 migrations apply DB --remote
          npx wrangler deploy
